      const RP = [[4180.0, 336.0], [4180.0, 336.0], [4179.8, 335.9], [4179.4, 335.6], [4178.5, 335.0], [4177.1, 334.1], [4175.0, 332.7], [4172.0, 330.8], [4168.0, 328.2], [4162.9, 324.9], [4156.3, 320.9], [4148.3, 315.9], [4138.5, 310.0], [4126.7, 303.2], [4112.7, 295.2], [4096.1, 286.2], [4076.8, 276.1], [4054.2, 264.8], [4028.1, 252.3], [3998.1, 238.7], [3963.6, 224.0], [3924.2, 208.3], [3879.3, 191.5], [3828.4, 173.9], [3770.8, 155.6], [3706.0, 136.6], [3633.2, 117.2], [3551.8, 97.7], [3461.2, 78.2], [3360.7, 59.1], [3249.7, 40.7], [3127.6, 23.4], [2994.2, 7.6], [2849.1, -6.2], [2692.1, -17.4], [2523.4, -25.4], [2343.5, -29.8], [2163.3, -29.7], [1993.9, -25.7], [1835.9, -18.4], [1689.3, -8.5], [1554.3, 3.6], [1430.4, 17.2], [1317.5, 32.1], [1214.9, 47.8], [1122.1, 63.9], [1038.7, 80.3], [963.8, 96.5], [896.9, 112.5], [837.3, 128.0], [784.5, 143.0], [737.8, 157.2], [696.6, 170.6], [660.5, 183.1], [629.0, 194.6], [601.6, 205.3], [577.8, 214.9], [557.3, 223.5], [539.8, 231.2], [524.9, 238.0], [512.4, 243.9], [501.9, 248.9], [493.3, 253.1], [486.4, 256.6], [480.8, 259.4], [476.6, 261.5], [473.4, 263.2], [471.1, 264.4], [469.6, 265.2], [468.7, 265.6], [468.2, 265.9], [468.0, 266.0], [468.0, 266.0]];
