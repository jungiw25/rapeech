</svg><div class="layer"><div  style="position:absolute;left:1320px;top:300px;width:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="who2">고객</div><div class="bub q" id="q1">카드 분실 신고할게요</div></div><div  style="position:absolute;left:1320px;top:440px;width:0;height:0;display:flex;flex-direction:row;align-items:center;justify-content:center"><div class="bub a" id="a1">분실 신고가 완료됐어요<svg class="ck" width="30" height="30" viewBox="0 0 30 30" style="margin-left:12px;vertical-align:-6px"><circle cx="15" cy="15" r="14" fill="#ff4fd8"/><path d="M9 15.5 l4.5 4.5 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div  style="position:absolute;left:1320px;top:290px;width:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="who2">고객</div><div class="bub q" id="q2">해외에서 잃어버렸는데, 재발급은 어떻게 받나요?</div></div><div  style="position:absolute;left:1320px;top:420px;width:0;height:0;display:flex;flex-direction:row;align-items:center;justify-content:center"><div class="bub think" id="th">• • •</div></div><div  style="position:absolute;left:1320px;top:420px;width:0;height:0;display:flex;flex-direction:row;align-items:center;justify-content:center"><div class="bub a" id="a2">재발급 방법과 기간을 안내해 드릴게요<svg class="ck" width="30" height="30" viewBox="0 0 30 30" style="margin-left:12px;vertical-align:-6px"><circle cx="15" cy="15" r="14" fill="#ff4fd8"/><path d="M9 15.5 l4.5 4.5 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="plate" id="plate" style="left:660px;top:650px;width:600px">ConvAI<small>대화형 AI 플랫폼</small></div></div><div class="cap" id="k1"><div class="ct"><span class="cw k1-l">자주 하는 문의는 <span class="g">바로 처리</span>하고</span></div></div><div class="cap" id="k2"><div class="ct"><span class="cw k2-l">복잡한 질문은 <span class="g">맥락을 이해해</span> 답하고</span></div></div><div class="cap" id="k3"><div class="ct"><span class="cw k3-l">고객센터 <span class="g">전체를</span> AI로</span></div></div><div class="cap" id="k4"><div class="ct"><span class="cw k4-l">이 모든 것을 하나의 플랫폼, <span class="g">ConvAI</span>로</span></div></div><img id="prev" class="layer" src="assets/flow_last.png" />

<script>

const tl = gsap.timeline({ paused: true });
const hsh = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const prep = (el) => { const L = el.getTotalLength(); el.setAttribute("stroke-dasharray", `${L} ${L}`); el.setAttribute("stroke-dashoffset", L); return L; };
const DR = (sel, t, d, e = "power2.inOut", s = 0) => gsap.utils.toArray(sel).forEach((el, i) => {
  const L = prep(el);
  tl.fromTo(el, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: e, immediateRender: false }, t + i * s);
});
// 게이지가 d초 동안 차고, 다 차면 반짝(안쪽 흰빛 + 퍼지는 고리 + 게이지 잠깐 굵게)
const GAUGE = (id, t, d = 0.9) => {
  DR("#" + id + "-ring", t, d, "power2.inOut");
  const r = +document.getElementById(id + "-fr").getAttribute("r");
  tl.fromTo("#" + id + "-fin", { opacity: 0 }, { opacity: 0.55, duration: 0.08, ease: "none", immediateRender: false }, t + d);
  tl.to("#" + id + "-fin", { opacity: 0, duration: 0.6, ease: "power2.out" }, t + d + 0.08);
  tl.fromTo("#" + id + "-fr", { opacity: 0.9, attr: { r } }, { opacity: 0, attr: { r: r + 34 }, duration: 0.8, ease: "power2.out", immediateRender: false }, t + d);
  tl.fromTo("#" + id + "-ring", { attr: { "stroke-width": 4 } }, { attr: { "stroke-width": 7 }, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t + d);
};
const CAP = (id, a, b) => {
  tl.fromTo("#" + id, { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, a);
  tl.fromTo("." + id + "-l", { yPercent: 120 }, { yPercent: 0, duration: 1.0, ease: "expo.out", stagger: 0.08 }, a);
  if (b) tl.to("." + id + "-l", { yPercent: -120, duration: 0.45, ease: "power2.in", stagger: 0.04 }, b);
};
const FIN = (sel, t, d = 0.6, e = "power2.out") => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: e, immediateRender: false }, t);
const FOUT = (sel, t, d = 0.5, e = "sine.inOut") => tl.to(sel, { opacity: 0, duration: d, ease: e }, t);
const speak = (sel, t0, t1, seed, step = 0.24) => gsap.utils.toArray(sel).forEach((el, k) => {
  let t = t0, s = 0;
  while (t < t1) { tl.to(el, { scaleY: 0.2 + 0.8 * hsh(k + seed, ++s) * Math.sin(Math.PI * (k + 0.5) / 7), duration: step, ease: "sine.inOut" }, t); t += step; }
});
// 선 꾸밈: 시작 점 + 끝으로 갈수록 진해지는 그라데이션 + 끝의 방향 화살표(가는 꺾쇠). 점·화살표 클래스는 "dk-<선 id>"
let __dg = 0;
const DECOR = (sel, o = {}) => gsap.utils.toArray(sel).forEach((p) => {
  const NS = "http://www.w3.org/2000/svg", L = p.getTotalLength(), a = p.getPointAtLength(0), b = p.getPointAtLength(L), c = p.getPointAtLength(Math.max(0, L - 8));
  const svg = p.ownerSVGElement;
  let defs = svg.querySelector("defs"); if (!defs) { defs = document.createElementNS(NS, "defs"); svg.prepend(defs); }
  const g = document.createElementNS(NS, "linearGradient"), id = "dg" + (__dg++), end = o.end || "#ff8be6";
  g.setAttribute("id", id); g.setAttribute("gradientUnits", "userSpaceOnUse");
  g.setAttribute("x1", a.x); g.setAttribute("y1", a.y); g.setAttribute("x2", b.x); g.setAttribute("y2", b.y);
  g.innerHTML = '<stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".55" stop-color="#d9c6ff" stop-opacity=".6"/><stop offset="1" stop-color="' + end + '" stop-opacity=".95"/>';
  defs.appendChild(g);
  p.setAttribute("stroke", "url(#" + id + ")"); p.removeAttribute("stroke-opacity"); p.setAttribute("stroke-linecap", "round");
  if (o.w) p.setAttribute("stroke-width", o.w);
  const ang = Math.atan2(b.y - c.y, b.x - c.x) * 180 / Math.PI, s = o.size || 9, cls = "dk-" + (p.id || "x");
  const ar = document.createElementNS(NS, "path");
  ar.setAttribute("d", `M${-s} ${-s * 0.72} L0 0 L${-s} ${s * 0.72}`);
  ar.setAttribute("fill", "none"); ar.setAttribute("stroke", end); ar.setAttribute("stroke-width", o.aw || 2.4);
  ar.setAttribute("stroke-linecap", "round"); ar.setAttribute("stroke-linejoin", "round");
  ar.setAttribute("transform", `translate(${b.x} ${b.y}) rotate(${ang})`); ar.setAttribute("class", cls);
  const st = document.createElementNS(NS, "circle");
  st.setAttribute("cx", a.x); st.setAttribute("cy", a.y); st.setAttribute("r", o.dot || 3.4); st.setAttribute("fill", "#fff"); st.setAttribute("fill-opacity", ".6"); st.setAttribute("class", cls);
  p.after(ar); p.after(st);
  if (o.hidden !== false) gsap.set([ar, st], { opacity: 0 });
});
// 점이 지나간 자리까지만 선이 그려짐(점과 선이 같은 진행값)
const ALONG = (pathSel, dotSel, t, d, e = "power2.inOut", drawLine = true) => {
  const p = document.querySelector(pathSel), L = drawLine ? prep(p) : p.getTotalLength(), q = { v: 0 };
  tl.fromTo(q, { v: 0 }, { v: 1, duration: d, ease: e, immediateRender: false, onUpdate: () => {
    const pt = p.getPointAtLength(q.v * L); gsap.set(dotSel, { x: pt.x, y: pt.y });
    if (drawLine) p.setAttribute("stroke-dashoffset", L * (1 - q.v));
  } }, t);
};


tl.to("#prev", { scale: 0.06, opacity: 0, transformOrigin: "960px 540px", duration: 1.1, ease: "power3.in" }, 0.0);

const CX = 560, CY = 440;
gsap.set(["#rings", "#r2", "#r3", "#t2", "#t3", "#center3", ".call", ".cc", "#q1", "#a1", "#q2", "#th", "#a2", "#plate", ".cap"], { opacity: 0 });
prep(document.getElementById("coreRing"));
// ── 1. 콜봇: 가장 안쪽 원
FIN("#rings", 0.8, 0.05);
tl.fromTo("#core", { scale: 0.3, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out", immediateRender: false }, 0.8);
DR("#coreRing", 1.2, 0.9, "power2.inOut");
CAP("k1", 1.4, 5.0);
// 콜봇은 끝까지 일함: 왼쪽에서 문의(점)가 계속 들어옴
for (let i = 0; i < 9; i++) {
  const t = 1.6 + i * 1.4, y = CY + [-40, 30, -10, 50, -55, 15, -30, 40, 0][i];
  tl.fromTo("#call" + i, { x: CX - 330, y, opacity: 0 }, { x: CX - 70, y: CY + (y - CY) * 0.3, opacity: 1, duration: 1.0, ease: "power1.in", immediateRender: false }, t);
  tl.to("#call" + i, { opacity: 0, duration: 0.15 }, t + 1.0);
}
tl.fromTo("#q1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 1.8);
gsap.set(document.querySelector("#q1").previousSibling, { opacity: 0 });
FIN(document.querySelector("#q1").previousSibling, 1.8, 0.6);
tl.fromTo("#a1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.9);
FOUT(["#q1", "#a1", document.querySelector("#q1").previousSibling], 4.9, 0.4);
// ── 2. AI 에이전트: 바깥 원이 넓어짐(콜봇 원은 그대로 밝게)
DR("#r2", 5.2, 1.0, "power2.inOut"); FIN("#r2", 5.2, 0.05); FIN("#t2", 5.8, 0.5);
CAP("k2", 5.4, 9.5);
gsap.set(document.querySelector("#q2").previousSibling, { opacity: 0 });
FIN(document.querySelector("#q2").previousSibling, 5.7, 0.6);
tl.fromTo("#q2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 5.7);
tl.fromTo("#th", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 6.6);
for (let k = 0; k < 2; k++) tl.to("#th", { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 6.9 + k * 0.5);
tl.to("#th", { opacity: 0, duration: 0.2 }, 8.0);
tl.fromTo("#a2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 8.1);
FOUT(["#q2", "#a2", document.querySelector("#q2").previousSibling], 9.4, 0.4);
// ── 3. AICC: 가장 바깥 원 = 고객센터 전체
DR("#r3", 9.7, 1.1, "power2.inOut"); FIN("#r3", 9.7, 0.05); FIN("#t3", 10.3, 0.5);
CAP("k3", 9.9, 13.5);
FIN("#center3", 10.0, 0.6);
for (let i = 0; i < 6; i++) {
  const t = 10.5 + i * 0.4, y0 = 330 + i * 45, toA = i !== 4;
  tl.fromTo("#cc" + i, { x: 1080, y: y0, opacity: 0 }, { x: toA ? 1400 : 1405, y: toA ? 380 + (i - 2.5) * 6 : 520, opacity: 1, duration: 1.1, ease: "power1.inOut", immediateRender: false }, t);
  tl.to("#cc" + i, { opacity: 0, duration: 0.2 }, t + 1.1);
}
FOUT("#center3", 13.4, 0.4);
// ── 4. 모두 하나의 플랫폼 위에
tl.to("#rings", { x: 960 - CX, y: -40, scale: 0.85, transformOrigin: "560px 440px", duration: 1.0, ease: "power3.inOut" }, 13.6);
tl.fromTo("#plate", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, 14.3);
CAP("k4", 14.0, null);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
