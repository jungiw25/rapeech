e cx="1300" cy="330" r="70" fill="#1a1233" stroke="#ff4fd8" stroke-width="4"/><circle cx="1300" cy="610" r="70" fill="#1a1233" stroke="#ff4fd8" stroke-width="4"/><circle class="cd" id="cd6" r="16" fill="#fff"/></g><g class="cell" transform="translate(1182.0 479.0) scale(0.3)"><image href="assets/customer.png" x="190" y="330" width="220" height="220"/><path id="c7a" d="M420 430 C 700 430, 900 330, 1228 330" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/><path id="c7b" d="M420 480 C 700 480, 900 610, 1228 610" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/><circle cx="1300" cy="330" r="70" fill="#1a1233" stroke="#ff4fd8" stroke-width="4"/><circle cx="1300" cy="610" r="70" fill="#1a1233" stroke="#ff4fd8" stroke-width="4"/><circle class="cd" id="cd7" r="16" fill="#fff"/></g></g>

pan class="g">맥락을 이해해</span> 답하고</span></div></div><div class="cap" id="k3"><div class="tag"><span class="k3-l">AICC 구축</span></div><div class="ct"><span class="cw k3-l">이런 대화 수백 개가 동시에, <span class="g">고객센터 전체</span>를 AI로</span></div></div><div class="cap" id="k4"><div class="tag"><span class="k4-l">ConvAI  ·  조달청 우수조달물품 지정 2026</span></div><div class="ct"><span class="cw k4-l">이 모든 것을 하나의 플랫폼, <span class="g">ConvAI</span>로</span></div></div><img id="prev" class="layer" src="assets/flow_last.png" />

<script>

const tl = gsap.timeline({ paused: true });
const hsh = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const prep = (el) => { const L = el.getTotalLength(); el.setAttribute("stroke-dasharray", `${L} ${L}`); el.setAttribute("stroke-dashoffset", L); return L; };
const DR = (sel, t, d, e = "power2.inOut", s = 0) => gsap.utils.toArray(sel).forEach((el, i) => {
  const L = prep(el);
  tl.fromTo(el, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: e, immediateRender: false }, t + i * s);
});
// 게이지가 d초 동안 차고, 다 차면 반짝(안쪽 흰빛 + 퍼지는 고리 + 게이지 잠깐 굵게)
const GAUGE = (id, t, d = 0.9) => {
  DR("#" + id + "-ring", t, d, "power2.inOut");
  const r = +document.getElementById(id + "-fr").getAttribute("r");
  tl.fromTo("#" + id + "-fin", { opacity: 0 }, { opacity: 0.55, duration: 0.08, ease: "none", immediateRender: false }, t + d);
  tl.to("#" + id + "-fin", { opacity: 0, duration: 0.6, ease: "power2.out" }, t + d + 0.08);
  tl.fromTo("#" + id + "-fr", { opacity: 0.9, attr: { r } }, { opacity: 0, attr: { r: r + 34 }, duration: 0.8, ease: "power2.out", immediateRender: false }, t + d);
  tl.fromTo("#" + id + "-ring", { attr: { "stroke-width": 4 } }, { attr: { "stroke-width": 7 }, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t + d);
};
const CAP = (id, a, b) => {
  tl.fromTo("#" + id, { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, a);
  tl.fromTo("." + id + "-l", { yPercent: 120 }, { yPercent: 0, duration: 1.0, ease: "expo.out", stagger: 0.08 }, a);
  if (b) tl.to("." + id + "-l", { yPercent: -120, duration: 0.45, ease: "power2.in", stagger: 0.04 }, b);
};
const FIN = (sel, t, d = 0.6, e = "power2.out") => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: e, immediateRender: false }, t);
const FOUT = (sel, t, d = 0.5, e = "sine.inOut") => tl.to(sel, { opacity: 0, duration: d, ease: e }, t);
const speak = (sel, t0, t1, seed, step = 0.24) => gsap.utils.toArray(sel).forEach((el, k) => {
  let t = t0, s = 0;
  while (t < t1) { tl.to(el, { scaleY: 0.2 + 0.8 * hsh(k + seed, ++s) * Math.sin(Math.PI * (k + 0.5) / 7), duration: step, ease: "sine.inOut" }, t); t += step; }
});
// 점이 지나간 자리까지만 선이 그려짐(점과 선이 같은 진행값)
const ALONG = (pathSel, dotSel, t, d, e = "power2.inOut", drawLine = true) => {
  const p = document.querySelector(pathSel), L = drawLine ? prep(p) : p.getTotalLength(), q = { v: 0 };
  tl.fromTo(q, { v: 0 }, { v: 1, duration: d, ease: e, immediateRender: false, onUpdate: () => {
    const pt = p.getPointAtLength(q.v * L); gsap.set(dotSel, { x: pt.x, y: pt.y });
    if (drawLine) p.setAttribute("stroke-dashoffset", L * (1 - q.v));
  } }, t);
};


tl.to("#prev", { scale: 0.06, opacity: 0, transformOrigin: "960px 540px", duration: 1.1, ease: "power3.in" }, 0.0);

gsap.set(["#convo", "#grid", ".cell", "#frame", "#frameT", "#n1", "#n2", "#l1", "#l2", "#d1", "#d2", "#q1", "#a1", "#q2", "#th", "#a2", "#plate", ".cap"], { opacity: 0 });
prep(document.getElementById("n1R")); prep(document.getElementById("n2R"));
// ── 1. 같은 고객, 간단한 문의 → 콜봇이 바로 처리
FIN("#convo", 0.9, 0.05);
tl.fromTo("#convo image", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, 0.9);
gsap.set("#convo image", { opacity: 0 });
tl.fromTo("#n1", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 1.3);
CAP("k1", 1.4, 6.3);
tl.fromTo("#q1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 1.9);
FIN("#l1", 2.5, 0.05); FIN("#d1", 2.5, 0.05);
ALONG("#l1", "#d1", 2.5, 1.0, "power2.inOut");
FOUT("#d1", 3.5, 0.2);
DR("#n1R", 3.4, 0.7, "power2.inOut");
tl.fromTo("#a1", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 4.1);
FOUT(["#q1"], 6.0, 0.4);
// ── 2. 같은 고객, 복잡한 질문 → AI 에이전트(콜봇과 같은 크기, 나란히)
tl.fromTo("#n2", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 6.6);
CAP("k2", 6.8, 12.2);
tl.fromTo("#q2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 7.2);
FIN("#l2", 7.9, 0.05); FIN("#d2", 7.9, 0.05);
ALONG("#l2", "#d2", 7.9, 1.0, "power2.inOut");
FOUT("#d2", 8.9, 0.2);
DR("#n2R", 8.8, 1.4, "power2.inOut");
tl.fromTo("#th", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 9.0);
for (let k = 0; k < 2; k++) tl.to("#th", { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 9.3 + k * 0.5);
tl.to("#th", { opacity: 0, duration: 0.2 }, 10.2);
tl.fromTo("#a2", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 10.3);
FOUT(["#q2", "#a1", "#a2"], 12.1, 0.4);
// ── 3. 물러나면: 같은 대화가 수백 개, 고객센터 전체
tl.to("#convo", { scale: 0.3, x: 960 - 1060 * 0.3, y: 430 - 470 * 0.3, svgOrigin: "0 0", duration: 1.4, ease: "power3.inOut" }, 12.4);
FIN("#grid", 13.3, 0.05);
gsap.utils.toArray(".cell").forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 0.75, duration: 0.6, ease: "sine.out", immediateRender: false }, 13.3 + i * 0.07));
DR("#frame", 13.6, 1.0, "power2.inOut"); FIN("#frame", 13.6, 0.05); FIN("#frameT", 14.2, 0.5);
CAP("k3", 13.0, 17.2);
// 고객센터 안의 대화들이 계속 오감(같은 점이 다시 흐름)
for (let r = 0; r < 2; r++) {
  const t = 14.4 + r * 1.3;
  ALONG("#l1", "#d1", t, 0.9, "power2.inOut", false); tl.fromTo("#d1", { opacity: 0 }, { opacity: 1, duration: 0.1, immediateRender: false }, t); FOUT("#d1", t + 0.9, 0.15);
  ALONG("#l2", "#d2", t + 0.5, 0.9, "power2.inOut", false); tl.fromTo("#d2", { opacity: 0 }, { opacity: 1, duration: 0.1, immediateRender: false }, t + 0.5); FOUT("#d2", t + 1.4, 0.15);
}
// ── 4. 모두 하나의 플랫폼 위에
