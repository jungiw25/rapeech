<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #faf9fd;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #intro-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="70.05"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="intro-video"
        class="clip"
        src="assets/intro.mp4"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
        playsinline
        style="z-index: 1"
      ></video>

      <div
        id="voice"
        data-composition-id="voice"
        data-composition-src="compositions/voice.html"
        data-start="12"
        data-duration="5.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="history"
        data-composition-id="history"
        data-composition-src="compositions/history.html"
        data-start="17.6"
        data-duration="6.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>

      <div
        id="ai"
        data-composition-id="ai"
        data-composition-src="compositions/ai.html"
        data-start="24.2"
        data-duration="9.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>

      <div
        id="listen"
        data-composition-id="listen"
        data-composition-src="compositions/listen.html"
        data-start="33.4"
        data-duration="7.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>

      <div
        id="ni"
        data-composition-id="ni"
        data-composition-src="compositions/ni.html"
        data-start="40.6"
        data-duration="10.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>

      <div
        id="synergy"
        data-composition-id="synergy"
        data-composition-src="compositions/synergy.html"
        data-start="51.1"
        data-duration="5.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 7"
      ></div>

      <div
        id="numbers"
        data-composition-id="numbers"
        data-composition-src="compositions/numbers.html"
        data-start="56.1"
        data-duration="6.45"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 8"
      ></div>

      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="62.55"
        data-duration="7.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 9"
      ></div>

      <audio
        id="bed"
        class="clip"
        src="assets/bed.wav"
        data-start="12"
        data-duration="58.05"
        data-track-index="2"
        data-volume="0.55"
        data-fade-in="1.2"
        data-fade-out="2"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
