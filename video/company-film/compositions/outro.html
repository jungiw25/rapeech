  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const bars = Array.from({ length: 12 }, (_, k) => "#o-b" + k);
      const stripes = Array.from({ length: 12 }, (_, k) => "#o-s" + k);
      const letters = Array.from({ length: 4 }, (_, k) => "#o-L" + k);

      // 1) 가운데에서 빛줄기가 양옆으로 그어짐
      tl.fromTo("#o-line", { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.05);
      // 2) 줄이 12개 막대로 갈라져 솟음 (한 번 말하듯)
      tl.to("#o-line", { scaleY: 0, opacity: 0, duration: 0.2, ease: "power3.in" }, 0.5);
      const env = (k) => Math.pow(Math.sin(Math.PI * (k + 0.5) / 12), 0.7);
      const amp = [0.55, 0.9, 0.35, 0.75];
      bars.forEach((b, k) => {
        tl.fromTo(b, { scaleY: 0.02, transformOrigin: "50% 50%" }, { scaleY: amp[0] * env(k), duration: 0.3, ease: "expo.out" }, 0.55 + Math.abs(k - 5.5) * 0.015);
        amp.slice(1).forEach((a, i) => {
          tl.to(b, { scaleY: Math.max(0.08, a * env(k) * (0.7 + 0.3 * ((k * 7 + i * 3) % 5) / 4)), duration: 0.14, ease: "power2.out" }, 0.85 + i * 0.14);
        });
        // 3) 로고 기울기로 눕고 모이며 작아짐
        tl.to(b, { rotation: 22.5, x: (k - 5.5) * -34, y: -75, scaleY: 0.22, duration: 0.45, ease: "power3.inOut" }, 1.3);
      });
      // 4) 밝은 화면이 원형으로 열림
      tl.fromTo("#o-light", { clipPath: "circle(0% at 50% 43%)" }, { clipPath: "circle(75% at 50% 43%)", duration: 0.55, ease: "power3.inOut" }, 1.45);

      // 5) 심볼: 사선이 아래에서 차례로 솟고, 삼각형이 돌아 들어옴
      tl.set("#o-lock", { x: 237 }, 0);
      tl.set(letters, { opacity: 0 }, 0);
      stripes.forEach((s, i) => {
        tl.fromTo(s, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.4, ease: "expo.out" }, 1.6 + i * 0.03);
      });
      tl.fromTo("#o-tri", { rotation: -100, scale: 0.6, opacity: 0, transformOrigin: "0% 0%" },
        { rotation: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, 2.0);

      // 6) 로고가 제자리로 가며 글자가 아래에서 차례로 올라옴
      tl.to("#o-lock", { x: 0, duration: 0.6, ease: "power3.inOut" }, 2.6);
      letters.forEach((l, i) => {
        tl.fromTo(l, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 2.85 + i * 0.07);
      });

      // 7) 마무리 문구
      tl.fromTo("#o-t1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.55);
      tl.fromTo("#o-t2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 3.8);
      tl.fromTo("#o-t3", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 4.0);

      window.__timelines["outro"] = tl;
    })();
  </script>
