  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // 꺾은선 길이 비율(점 사이 거리)로 각 노드까지의 진행도 계산
      const P = [[-60, 820], [320, 780], [1260, 690], [2160, 600], [3020, 500], [3600, 450]];
      const seg = P.slice(1).map((p, i) => Math.hypot(p[0] - P[i][0], p[1] - P[i][1]));
      const total = seg.reduce((a, b) => a + b, 0);
      const frac = []; let acc = 0;
      seg.forEach((l) => { acc += l; frac.push(acc / total); });
      // frac[0..3] = 노드 0..3, frac[4] = 끝

      // 제목
      tl.fromTo("#h-quiet", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 0.05);
      ["#h-w1", "#h-w2", "#h-w3"].forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 0.2 + i * 0.07);
      });

      const cam = [0, -100, -1000, -1850];
      const plan = [[0.25, 0.65], [1.05, 1.65], [2.25, 2.85], [3.45, 4.05]];
      tl.fromTo("#h-line", { strokeDashoffset: 1 }, { strokeDashoffset: 1 - frac[0], duration: plan[0][1] - plan[0][0], ease: "power2.out" }, plan[0][0]);
      for (let k = 1; k < 4; k++) {
        const [a, b] = plan[k];
        tl.to("#h-line", { strokeDashoffset: 1 - frac[k], duration: b - a, ease: "power2.inOut" }, a);
        tl.to("#h-stage", { x: cam[k], duration: b - a + 0.12, ease: "power2.inOut" }, a);
      }
      tl.to("#h-line", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 4.1);
      for (let k = 0; k < 4; k++) {
        const t = plan[k][1];
        tl.fromTo("#h-n" + k, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t - 0.02);
        tl.fromTo("#h-l" + k + " .h-year", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, t + 0.05);
        tl.fromTo("#h-l" + k + " .h-desc", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, t + 0.14);
      }
      for (let k = 0; k < 3; k++) {
        tl.to("#h-l" + k, { opacity: 0.35, duration: 0.3, ease: "power2.inOut" }, plan[k][1] + 1.9);
      }
      // 끝: 제목과 모든 연도 글이 빠진 뒤 마지막 노드로 줌 통과
      tl.to(["#h-quiet", "#h-big", "#h-l0", "#h-l1", "#h-l2", "#h-l3"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 5.7);
      tl.to("#h-n3 i", { opacity: 0, duration: 0.12, ease: "power2.in" }, 5.8);
      tl.to("#h-n3", { scale: 130, duration: 0.6, ease: "power3.in" }, 5.9);

      window.__timelines["history"] = tl;
    })();
  </script>
